name: Release

# Publishes when main gains a new version — i.e. when `development` merges in
# with a bumped `packages/fixui/package.json`.
#
#   git switch development
#   npm version patch --workspace fixui   # or minor / major
#   git push
#   # open a PR to main, merge it → this runs
#
# It publishes only when the version in the tree is not already on npm, so an
# ordinary merge that changes no version is a no-op rather than a failed run.
#
# Auth accepts either mechanism, so whichever you configure works:
#   • OIDC trusted publishing — no secret at all. Configure at
#     npmjs.com → fixui → Settings → Trusted Publisher (repo hulbu/fix-ui,
#     workflow release.yml). Preferred: nothing to leak or rotate.
#   • NPM_TOKEN — a granular token with write access to `fixui` and 2FA bypass,
#     stored as a repository secret. Used only if OIDC is not configured.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag step pushes back to the repo
      id-token: write # OIDC; harmless when publishing with a token instead
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Node 22 bundles npm 10.x, which has no idea trusted publishing exists —
      # it skips the OIDC exchange entirely and fails with ENEEDAUTH, as if no
      # credentials were configured. OIDC landed in npm 11.5.1.
      - run: npm install -g npm@latest
      - run: npm --version

      - run: pnpm install --frozen-lockfile

      # Nothing is published unless the whole gate is green. This is the reason
      # to automate releases at all — a bad merge fails here, not on npm.
      - run: pnpm -r typecheck
      - run: pnpm -r --filter '!e2e' test
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm --filter e2e test

      - name: Is this version already published?
        id: check
        run: |
          local_version=$(node -p "require('./packages/fixui/package.json').version")
          published=$(npm view fixui version 2>/dev/null || echo "none")
          echo "local=$local_version" >> "$GITHUB_OUTPUT"
          if [ "$local_version" = "$published" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::fixui@$local_version is already on npm — nothing to release."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing fixui@$local_version (npm has $published)."
          fi

      # No `registry-url` on setup-node and no NODE_AUTH_TOKEN here, deliberately.
      # `registry-url` writes an .npmrc line reading the token from that env var;
      # with no secret set it expands to a placeholder, npm treats it as configured
      # credentials, fails auth, and never attempts OIDC — ENEEDAUTH with trusted
      # publishing set up correctly. Trusted publishing needs NO credentials.
      #
      # `npm`, not `pnpm`: OIDC trusted publishing is an npm CLI feature and
      # pnpm does not perform the token exchange. The only reason this ever used
      # pnpm was rewriting `workspace:*` dependencies, and the single-package
      # merge left none — `fixui` depends on the MCP SDK and nothing local.
      # `--provenance` records where the artifact was built, which OIDC makes
      # free. `prepack` still builds, whichever CLI runs it.
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --provenance --access public
        working-directory: packages/fixui

      - name: Tag the release
        if: steps.check.outputs.publish == 'true'
        run: |
          git tag "v${{ steps.check.outputs.local }}"
          git push origin "v${{ steps.check.outputs.local }}"
